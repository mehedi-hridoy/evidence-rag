[project]
name = "evidencerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mehedi-hridoy", email = "mehedi.hridoy101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
evidencerag = "evidencerag:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres"]

[tool.importlinter]
root_package = "evidencerag"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
  "evidencerag.interfaces",
  "evidencerag.services",
  "evidencerag.adapters",
  "evidencerag.core",
  "evidencerag.domain",
]
services:
  db:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: evidencerag-db
    environment:
      POSTGRES_USER: evidencerag
      POSTGRES_PASSWORD: evidencerag
      POSTGRES_DB: evidencerag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencerag -d evidencerag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: